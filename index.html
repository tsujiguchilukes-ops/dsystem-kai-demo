<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dシステム改 — 草加 Lua</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="splash" class="splash">
  <canvas id="splashCanvas"></canvas>
  <div class="splash-inner">
    <div class="splash-logo">Dsystem <b>改</b></div>
    <div class="splash-line"></div>
    <div class="splash-sub">Lua 経営ダッシュボード</div>
  </div>
</div>
<script>
(function(){
  var c=document.getElementById('splashCanvas'); if(!c) return;
  var ctx=c.getContext('2d'), DPR=Math.min(window.devicePixelRatio||1,2);
  function size(){ c.width=innerWidth*DPR; c.height=innerHeight*DPR; }
  size();
  var reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  var W=function(){return c.width;}, H=function(){return c.height;};
  var cx=function(){return W()/2;}, cy=function(){return H()*0.46;};
  var R=function(){return Math.min(W(),H())*0.30;};
  var N = reduce?0:420, ps=[];
  // ブランドの色だけで組む。紫・水色を混ぜると途端に既製品っぽくなる
  var COL=['#b28c34','#c9a44c','#d9c188','#1f7a4d','#2f9160','#efe7d4'];
  for(var i=0;i<N;i++){
    var a=Math.random()*Math.PI*2, rr=R()*(0.82+Math.random()*0.5), sp=(Math.random()*0.5+0.35)*(Math.random()<0.5?1:1);
    ps.push({a:a, r:rr, base:rr, sp:0.006+Math.random()*0.010, sz:(Math.random()*2.4+0.6)*DPR,
      col:COL[(Math.random()*COL.length)|0], ph:Math.random()*Math.PI*2, wob:6*DPR+Math.random()*22*DPR, life:Math.random()});
  }
  var t0=performance.now(), raf;
  function frame(now){
    var el=(now-t0)/1000; // 秒
    ctx.clearRect(0,0,W(),H());
    ctx.globalCompositeOperation='lighter';
    var spin=el*0.8;
    for(var i=0;i<ps.length;i++){ var p=ps[i];
      p.a+=p.sp;
      var wob=Math.sin(el*1.4+p.ph)*p.wob;
      var rad=p.base+wob - Math.max(0,(el-3.0))*140*DPR*(0.3+p.life); // 後半は外へ拡散
      var x=cx()+Math.cos(p.a+spin)*rad, y=cy()+Math.sin(p.a+spin)*rad*0.92;
      var alpha=Math.max(0, 0.9 - Math.max(0,(el-3.4))*0.9);
      ctx.beginPath(); ctx.fillStyle=p.col; ctx.globalAlpha=alpha*(0.5+0.5*Math.sin(el*2+p.ph));
      ctx.arc(x,y,p.sz,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    if(el<5.2 && !reduce) raf=requestAnimationFrame(frame);
  }
  if(!reduce) raf=requestAnimationFrame(frame);
  addEventListener('resize', size);
})();
</script>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div>
        <div class="logo">Dsystem <b>改</b></div>
        <div class="sub">Lua 経営ダッシュボード</div>
      </div>
    </div>
    <select class="storepick"><option>草加 Lua</option></select>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <main class="main">
    <div class="topbar">
      <button class="btn ghost sm menu-btn" id="menuBtn">☰</button>
      <h1 id="pageTitle">まとめ</h1>
      <div class="spacer"></div>
      <span class="pill" id="ymPill">2026年 08月</span>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<script src="js/schema.js"></script>
<script src="js/data.js"></script>
<script src="js/calc.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
